<script>
  function openVideo(startTime) {
    var modal = document.getElementById('videoModal');
    var player = document.getElementById('youtubePlayer');
    player.src = "https://www.youtube.com/embed/KQ0YJ8a2waE?autoplay=1&start=" + startTime;
    modal.style.display = 'flex';
  }

  function closeVideo() {
    var modal = document.getElementById('videoModal');
    var player = document.getElementById('youtubePlayer');
    modal.style.display = 'none';
    player.src = "";
  }

  document.getElementById('n8n-signup-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const emailInput = document.getElementById('user-email');
    const submitBtn = document.getElementById('submit-btn');
    const statusDiv = document.getElementById('form-status');

    // UI: Loading State
    submitBtn.disabled = true;
    submitBtn.innerText = "ROUTING...";
    statusDiv.className = 'form-status loading';
    statusDiv.innerText = 'TRANSMITTING TO TERMINAL...';
    
    try {
      // Execute Webhook POST request
      const response = await fetch('https://seanskin.app.n8n.cloud/webhook/1be460bd-0399-4004-9996-fb2726077bc1', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ email: emailInput.value })
      });

      if (response.ok) {
        // UI: Success State
        statusDiv.className = 'form-status success';
        statusDiv.innerText = 'SUCCESS: CHECK YOUR INBOX FOR THE ONBOARDING LINK.';
        emailInput.value = ''; // clear field
      } else {
        throw new Error('Webhook error');
      }
    } catch (error) {
      // UI: Error State
      statusDiv.className = 'form-status error';
      statusDiv.innerText = 'ERROR: TRANSMISSION FAILED. PLEASE TRY AGAIN.';
    } finally {
      // Reset Button State
      submitBtn.disabled = false;
      submitBtn.innerText = "SIGN UP - EMAIL ADDRESS";
      
      // Hide status message after 6 seconds
      setTimeout(() => {
        statusDiv.style.display = 'none';
        statusDiv.className = 'form-status';
      }, 6000);
    }
  });
</script>
