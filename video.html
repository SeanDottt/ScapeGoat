<head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1SYJXQBKTS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Walkthrough | ScapeGoat</title>
    
    <style>
        body, html {
            margin: 0; 
            padding: 0;
            background-color: #F4F7FA;
            color: #1A202C;
            width: 100%;
            min-height: 100vh;
            display: flex; 
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            box-sizing: border-box;
            position: relative;
        }

        /* Animated Soft Wave Hatch Layer */
        body::before {
            content: "";
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            z-index: -1;
            pointer-events: none;
            
            /* Varied Opacity Angled Lines */
            background-image: repeating-linear-gradient(
                45deg,
                rgba(26, 32, 44, 0.28) 0px,
                rgba(26, 32, 44, 0.28) 1.5px,
                transparent 1.5px,
                transparent 11px,
                rgba(26, 32, 44, 0.05) 11px,
                rgba(26, 32, 44, 0.05) 12.5px,
                transparent 12.5px,
                transparent 22px
            );

            /* Moving Radial Wave Mask */
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.85) 100%);
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.85) 100%);
            -webkit-mask-size: 160% 160%;
            mask-size: 160% 160%;

            animation: waveMotion 12s ease-in-out infinite alternate;
        }

        /* Undulating Wave Keyframes */
        @keyframes waveMotion {
            0% {
                -webkit-mask-position: 0% 0%;
                mask-position: 0% 0%;
                transform: scale(1);
            }
            50% {
                -webkit-mask-position: 100% 50%;
                mask-position: 100% 50%;
                transform: scale(1.03) rotate(0.5deg);
            }
            100% {
                -webkit-mask-position: 30% 100%;
                mask-position: 30% 100%;
                transform: scale(0.98);
            }
        }

        /* BANNER SECTION */
        .banner-container {
            width: 100%;
            max-width: 900px; 
            padding: 40px 20px 20px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 0px;
            border: 3px solid #1A202C;
            box-shadow: 6px 6px 0px #1A202C;
            background-color: #FFFFFF;
            display: block;
        }

        /* ULTRA-WIDE VIDEO SECTION */
        .video-wrapper {
            position: relative;
            width: 92vw; 
            max-width: 1400px; 
            margin: 10px 0 40px 0;
            aspect-ratio: 16 / 9;
            background: #FFFFFF;
            border: 3px solid #1A202C;
            box-shadow: 8px 8px 0px #1A202C;
            border-radius: 0px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* THE GHOST SHIELD */
        .video-shield {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12%;
            height: 12%;
            background: transparent;
            z-index: 10;
        }

        /* FOOTER & BUTTON */
        .footer {
            margin-top: auto;
            padding: 20px 0 60px 0;
            text-align: center;
        }

        .back-link {
            color: #1A202C;
            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 14px 36px;
            border: 3px solid #1A202C;
            border-radius: 0px;
            background: #FFFFFF;
            box-shadow: 4px 4px 0px #1A202C;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease;
            display: inline-block;
        }

        .back-link:hover {
            background-color: #FF4B01;
            color: #FFFFFF;
            box-shadow: 6px 6px 0px #1A202C;
            transform: translate(-2px, -2px);
        }

        .back-link:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #1A202C;
        }

        @media (max-width: 800px) {
            .video-wrapper { 
                width: 100vw; 
                border-left: none; 
                border-right: none; 
                box-shadow: none; 
                border-radius: 0px; 
            }
            .banner-container { 
                padding: 20px 10px; 
            }
        }
    </style>
</head>
<body>

    <div class="banner-container">

    </div>

    <div class="video-wrapper">
        <div class="video-shield"></div>
        <iframe 
            src="https://www.youtube.com/embed/TFSboxNFcwI?rel=0&modestbranding=1&iv_load_policy=3&autoplay=0&hd=1"

            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

        </iframe>
    </div>

    <footer class="footer">
        <a href="index.html" class="back-link">Return to Terminal</a>
    </footer>

</body>
</html>
