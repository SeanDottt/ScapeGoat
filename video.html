<!DOCTYPE html>
<html lang="en">
<head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1SYJXQBKTS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Walkthrough | ScapeGoat</title>
    <meta name="description" content="Operational walkthrough and system architecture video guide for Scapegoat.">
    
    <style>
        body, html {
            margin: 0; 
            padding: 0;
            background-color: #F4F7FA;
            /* Static diagonal hatch pattern (8% opacity Dark Slate) */
            background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M-2 18L18 -2M-2 10L10 -2M-2 2L2 -2M6 18L18 6M14 18L18 14' stroke='%231A202C' stroke-width='1.5' stroke-opacity='0.08'/%3E%3C/svg%3E");
            background-repeat: repeat;
            color: #1A202C;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* NAVIGATION BUTTON */
        .nav-header {
            width: 100%;
            max-width: 1000px;
            padding: 24px 20px 0 20px;
            box-sizing: border-box;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            background: #FFFFFF;
            color: #1A202C !important;
            border: 2.5px solid #1A202C;
            box-shadow: 3px 3px 0px #1A202C;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
        }

        .nav-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #1A202C;
            background-color: #F4F7FA;
        }

        .nav-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #1A202C;
        }

        /* BANNER SECTION */
        .banner-container {
            width: 100%;
            max-width: 1000px; 
            padding: 20px 20px 10px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 0px;
            border: 4px solid #1A202C;
            box-shadow: 8px 8px 0px #1A202C;
            background-color: #FFFFFF;
            display: block;
        }

        /* ULTRA-WIDE VIDEO SECTION */
        .video-wrapper {
            position: relative;
            width: 100%; 
            max-width: 1000px; 
            margin: 16px 0 32px 0;
            aspect-ratio: 16 / 9;
            background: #FFFFFF;
            border: 4px solid #1A202C;
            box-shadow: 8px 8px 0px #1A202C;
            border-radius: 0px;
            overflow: hidden;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* GHOST SHIELD */
        .video-shield {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12%;
            height: 12%;
            background: transparent;
            z-index: 10;
        }

        /* SUBTLE SECONDARY UTILITY FOOTER */
        footer {
            width: 100%;
            max-width: 1000px;
            padding: 16px 20px;
            box-sizing: border-box;
            background: #FFFFFF;
            border: 4px solid #1A202C;
            box-shadow: 8px 8px 0px #1A202C;
            color: #1A202C;
            flex-shrink: 0;
            margin-top: auto;
            margin-bottom: 32px;
        }

        .footer-cta-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .footer-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 14px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-decoration: none;
            border: 1.5px solid #1A202C;
            background-color: transparent;
            color: #1A202C !important;
            box-shadow: none;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .footer-btn:hover {
            background-color: #1A202C;
            color: #FFFFFF !important;
        }

        .footer-btn:active {
            transform: scale(0.97);
        }

        .footer-divider {
            height: 1px;
            background-color: #E2E8F0;
            margin-bottom: 12px;
            border: none;
        }

        .footer-meta {
            text-align: center;
        }

        .footer-credits {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #1A202C;
            margin-bottom: 6px;
        }

        .footer-credits a {
            color: #FF4B01;
            text-decoration: underline;
            font-weight: 900;
        }

        .footer-legal-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .footer-legal-links a {
            color: #718096;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .footer-legal-links a:hover {
            color: #1A202C;
            text-decoration: underline;
        }

        .footer-legal-links .sep {
            color: #A0AEC0;
        }

        /* MOBILE RESPONSIVE ADAPTATION (<= 800px) */
        @media (max-width: 800px) {
            .nav-header {
                padding: 16px 12px 0 12px;
            }

            .banner-container { 
                padding: 12px 8px; 
            }

            .banner-img {
                border-width: 3px;
                box-shadow: none;
            }

            .video-wrapper { 
                width: 100vw; 
                border-left: none; 
                border-right: none; 
                box-shadow: none; 
                border-radius: 0px; 
                margin: 12px 0 20px 0;
            }

            footer {
                max-width: 100%;
                border-left: none;
                border-right: none;
                box-shadow: none;
                border-radius: 0;
                padding: 14px 12px;
                margin-bottom: 12px;
            }

            .footer-cta-row {
                gap: 8px;
            }

            .footer-btn {
                flex: 1;
                padding: 8px;
                font-size: 10px;
            }
        }
    </style>
</head>
