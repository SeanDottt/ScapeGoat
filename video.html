    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0; 
            padding: 0;
            background-color: #F4F7FA;
            background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M-2 18L18 -2M-2 10L10 -2M-2 2L2 -2M6 18L18 6M14 18L18 14' stroke='%231A202C' stroke-width='1.5' stroke-opacity='0.08'/%3E%3C/svg%3E");

            color: #1A202C;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0 clamp(8px, 2vw, 16px);
        }

        /* UNIFIED COLUMN MAX-WIDTH */
        .brand-header-link,
        .video-container,
        footer {
            width: 100%;
            max-width: 960px;
        }

        /* STANDALONE IMAGE BANNER BUTTON */
        .brand-header-link {
            text-decoration: none;
            display: block;
            margin: clamp(20px, 4vw, 40px) auto 24px auto;
        }

        .brand-header-img {
            width: 100%;
            max-width: 440px;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            mix-blend-mode: multiply; 
        }

        .brand-header-img:hover {
            transform: translate(-2px, -2px);
            filter: brightness(1.03);
        }

        .brand-header-img:active {
            transform: translate(1px, 1px);
        }

        /* CENTRAL VIDEO CARD CONTAINER */
        .video-container {
            margin: 0 auto 24px auto;
            padding: clamp(14px, 3.5vw, 32px);
            background: #FFFFFF;
            border: clamp(2px, 0.4vw, 4px) solid #1A202C;
            box-shadow: clamp(4px, 1vw, 10px) clamp(4px, 1vw, 10px) 0px #1A202C;
        }

        .header-section {
            border-bottom: 3px solid #1A202C;
            padding-bottom: 16px;
            margin-bottom: clamp(16px, 2.5vw, 24px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            color: #1A202C;
            font-size: clamp(1.15rem, 2.5vw, 1.5rem);
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            margin: 0;
        }

        .date-badge {
            display: inline-block;
            background: #1A202C;
            color: #FF4B01;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 12px;
            border-radius: 2px;
        }

        /* PERFECT 16:9 RESPONSIVE VIDEO WRAPPER */
        .video-wrapper {
            position: relative;
            width: 100%; 
            aspect-ratio: 16 / 9;
            background: #1A202C;
            border: clamp(2px, 0.3vw, 3px) solid #1A202C;
            box-shadow: clamp(3px, 0.8vw, 6px) clamp(3px, 0.8vw, 6px) 0px #1A202C;
            overflow: hidden;
            margin-bottom: clamp(20px, 3vw, 28px);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .video-shield {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 15%;
            height: 15%;
            background: transparent;
            z-index: 10;
        }

        /* RETURN NAVIGATION CTA */
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            background: #FF4B01;
            color: #FFFFFF !important;
            border: 3px solid #1A202C;
            box-shadow: clamp(3px, 0.6vw, 4px) clamp(3px, 0.6vw, 4px) 0px #1A202C;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
        }

        .nav-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #1A202C;
            background-color: #E03E00;
        }

        .nav-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #1A202C;
        }

        /* UNIFIED FOOTER COMPONENT */
        footer {
            padding: 20px;
            background: #FFFFFF;
            border: clamp(2px, 0.4vw, 4px) solid #1A202C;
            box-shadow: clamp(4px, 0.8vw, 8px) clamp(4px, 0.8vw, 8px) 0px #1A202C;
            color: #1A202C;
            margin-top: auto;
            margin-bottom: 40px;
        }

        .footer-cta-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .footer-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-decoration: none;
            border: 1.5px solid #1A202C;
            background-color: transparent;
            color: #1A202C !important;
            transition: all 0.15s ease;
        }

        .footer-btn:hover {
            background-color: #1A202C;
            color: #FFFFFF !important;
        }

        .footer-divider {
            height: 1px;
            background-color: #E2E8F0;
            margin-bottom: 12px;
            border: none;
        }

        .footer-meta {
            text-align: center;
        }

        .footer-credits {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #1A202C;
            margin-bottom: 6px;
        }

        .footer-credits a {
            color: #FF4B01;
            text-decoration: underline;
            font-weight: 900;
        }

        .footer-legal-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .footer-legal-links a {
            color: #718096;
            text-decoration: none;
            transition: color 0.15s ease;

        .footer-legal-links a:hover {
            color: #1A202C;
            text-decoration: underline;

        .footer-legal-links .sep {

        }

        /* MOBILE RESPONSIVE ADAPTATION */
        @media (max-width: 768px) {

            }
