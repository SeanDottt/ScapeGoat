<head>

    <title>Walkthrough | ScapeGoat</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

        body, html {
            margin: 0; 
            padding: 0;
            background-color: #F4F7FA;
            /* Static diagonal hatch pattern (8% opacity Dark Slate) */
            background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M-2 18L18 -2M-2 10L10 -2M-2 2L2 -2M6 18L18 6M14 18L18 14' stroke='%231A202C' stroke-width='1.5' stroke-opacity='0.08'/%3E%3C/svg%3E");
            background-repeat: repeat;
            color: #1A202C;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* BRAND HEADER LINK & CARD LAYOUT */
        .brand-header-link {
            text-decoration: none;
            display: block;
            width: 100%;
            max-width: 720px;
            margin: 32px auto 20px auto;
            box-sizing: border-box;
        }

        .brand-header-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #FFFFFF;
            border: 4px solid #1A202C;
            border-left: 12px solid #FF4B01;
            box-shadow: 8px 8px 0px #1A202C;
            box-sizing: border-box;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .brand-header-banner:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0px #1A202C;
        }

        /* CONDENSED HEADLINE SANS-SERIF TYPOGRAPHY */
        .banner-title {
            font-family: 'Oswald', 'Arial Narrow', Impact, sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #1A202C;
            line-height: 1;
            margin: 0;
        }

        .banner-logo {
            height: 44px;
            width: auto;
            border: 2px solid #1A202C;
            background: #1A202C;
            padding: 2px;
            box-sizing: border-box;
            display: block;
        }

        /* CENTRAL VIDEO CARD CONTAINER */
        .video-container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto 20px auto;
            padding: 32px 28px;
            box-sizing: border-box;
            background: #FFFFFF;
            border: 4px solid #1A202C;
            box-shadow: 8px 8px 0px #1A202C;
            flex: 1 0 auto;
        }

        .header-section {
            border-bottom: 3px solid #1A202C;
            padding-bottom: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            color: #1A202C;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            margin: 0;
        }

        .date-badge {
            display: inline-block;
            background: #1A202C;
            color: #FF4B01;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 2px;
        }

        /* EMBEDDED VIDEO FRAMEWORK */
        .video-wrapper {
            position: relative;
            width: 100%; 
            aspect-ratio: 16 / 9;
            background: #1A202C;
            border: 3px solid #1A202C;
            box-shadow: 5px 5px 0px #1A202C;
            border-radius: 0px;
            overflow: hidden;
            box-sizing: border-box;
            margin-bottom: 24px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .video-shield {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12%;
            height: 12%;
            background: transparent;
            z-index: 10;
        }

        /* RETURN NAVIGATION CTA */
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 20px;
            background: #FF4B01;
            color: #FFFFFF !important;
            border: 3px solid #1A202C;
            box-shadow: 4px 4px 0px #1A202C;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-sizing: border-box;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
        }

        .nav-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #1A202C;
            background-color: #E03E00;
        }

        .nav-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #1A202C;
        }

        /* UNIFIED FOOTER COMPONENT */
        footer {
            width: 100%;
            max-width: 720px;
            padding: 16px 20px;
            box-sizing: border-box;
            background: #FFFFFF;
            border: 4px solid #1A202C;
            box-shadow: 8px 8px 0px #1A202C;
            color: #1A202C;
            flex-shrink: 0;
            margin-top: auto;
            margin-bottom: 32px;
        }

        .footer-cta-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .footer-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 14px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-decoration: none;
            border: 1.5px solid #1A202C;
            background-color: transparent;
            color: #1A202C !important;
            box-shadow: none;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .footer-btn:hover {
            background-color: #1A202C;
            color: #FFFFFF !important;
        }

        .footer-btn:active {
            transform: scale(0.97);
        }

        .footer-divider {
            height: 1px;
            background-color: #E2E8F0;
            margin-bottom: 12px;
            border: none;
        }

        .footer-meta {
            text-align: center;
        }

        .footer-credits {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #1A202C;
            margin-bottom: 6px;
        }

        .footer-credits a {
            color: #FF4B01;
            text-decoration: underline;
            font-weight: 900;
        }

        .footer-legal-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .footer-legal-links a {
            color: #718096;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .footer-legal-links a:hover {
            color: #1A202C;
            text-decoration: underline;
        }

        .footer-legal-links .sep {
            color: #A0AEC0;
        }

        /* MOBILE RESPONSIVE ADAPTATION (<= 768px) */
        @media (max-width: 768px) {
            .brand-header-link,
            .video-container,
            footer {
                max-width: 100%;
                border-left: none;
                border-right: none;
                box-shadow: none;
                border-radius: 0;
            }

            .brand-header-link {
                margin: 0 auto 12px auto;
            }

            .brand-header-banner {
                border-left: 8px solid #FF4B01;
                padding: 10px 16px;
            }

            .banner-title {
                font-size: 1.8rem;
            }

            .banner-logo {
                height: 36px;
            }

            .video-container {
                padding: 20px 16px;
                margin-bottom: 12px;
            }

            footer {
                padding: 14px 12px;
                margin-bottom: 0;
            }

            .footer-cta-row {
                gap: 8px;
            }

            .footer-btn {
                flex: 1;
                padding: 8px;
                font-size: 10px;
            }
